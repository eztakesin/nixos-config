<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Three ways to unlock, one volume key</title><desc id="d">The YubiKey with its PIN and a touch, the passphrase, or the recovery key each opens its own keyslot in the header on the key stick. Every keyslot releases the same volume key, which decrypts the disk.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e9bad"/></marker></defs><text x="410" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="410" dy="0">Three ways to unlock, one volume key</tspan></text><rect x="330" y="60" width="220" height="210" rx="12" fill="#d42b63" stroke="#8e9bad" stroke-width="1.5"/><text x="440" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" dominant-baseline="middle"><tspan x="440" dy="0">Header (on the key stick)</tspan></text><rect x="30" y="60" width="230" height="56" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="145" y="78.85000000000001" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="145" dy="0">YubiKey</tspan></text><text x="145" y="98.10000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="145" dy="0">FIDO2 PIN + touch, every day</tspan></text><g transform="translate(40 76) scale(1)" fill="none" stroke="#5a667a" color="#5a667a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="12" height="6" rx="1"/><rect x="15" y="10" width="6" height="4"/><line x1="17" y1="11.3" x2="19" y2="11.3"/><line x1="17" y1="12.7" x2="19" y2="12.7"/></g><rect x="350" y="104" width="180" height="40" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="440" y="124" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="440" dy="0">keyslot</tspan></text><line x1="260" y1="88" x2="350" y2="124" stroke="#8e9bad" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="136" width="230" height="56" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="145" y="154.85" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="145" dy="0">Passphrase</tspan></text><text x="145" y="174.1" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="145" dy="0">six or more random words</tspan></text><g transform="translate(40 152) scale(1)" fill="none" stroke="#5a667a" color="#5a667a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="1.5"/><line x1="7" y1="14" x2="17" y2="14"/><path d="M6.5 10.5h.01M9.5 10.5h.01M12.5 10.5h.01M15.5 10.5h.01M18 10.5h.01" stroke-width="2.4"/></g><rect x="350" y="158" width="180" height="40" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="440" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="440" dy="0">keyslot</tspan></text><line x1="260" y1="164" x2="350" y2="178" stroke="#8e9bad" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="212" width="230" height="56" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="145" y="230.85" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="145" dy="0">Recovery key</tspan></text><text x="145" y="250.1" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="145" dy="0">on paper, for emergencies</tspan></text><g transform="translate(40 228) scale(1)" fill="none" stroke="#5a667a" color="#5a667a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 h8 l5 5 v13 H6 Z"/><path d="M14 3 v5 h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></g><rect x="350" y="212" width="180" height="40" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="440" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="440" dy="0">keyslot</tspan></text><line x1="260" y1="240" x2="350" y2="232" stroke="#8e9bad" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="100" width="215" height="56" rx="10" fill="#057ba8" stroke="#8e9bad" stroke-width="1.5"/><text x="692.5" y="111.7" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" dominant-baseline="middle"><tspan x="692.5" dy="0">Volume key</tspan></text><text x="692.5" y="130.95" text-anchor="middle" font-size="11" font-weight="400" fill="rgba(255,255,255,.92)" dominant-baseline="middle"><tspan x="692.5" dy="0">random, 512 bits,</tspan><tspan x="692.5" dy="14.3">in memory while unlocked</tspan></text><rect x="585" y="200" width="215" height="56" rx="10" fill="#057ba8" stroke="#8e9bad" stroke-width="1.5"/><text x="692.5" y="218.85" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" dominant-baseline="middle"><tspan x="692.5" dy="0">The disk</tspan></text><text x="692.5" y="238.1" text-anchor="middle" font-size="11" font-weight="400" fill="rgba(255,255,255,.92)" dominant-baseline="middle"><tspan x="692.5" dy="0">every byte encrypted</tspan></text><g transform="translate(595 216) scale(1)" fill="none" stroke="#ffffff" color="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5 V7.5 a4 4 0 0 1 8 0 V10.5"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></g><line x1="550" y1="165" x2="585" y2="128" stroke="#8e9bad" stroke-width="2" marker-end="url(#arrow)"/><line x1="692.5" y1="156" x2="692.5" y2="200" stroke="#8e9bad" stroke-width="2" marker-end="url(#arrow)"/></svg>
