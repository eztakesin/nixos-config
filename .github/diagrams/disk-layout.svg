<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Two devices: the key stick and the internal disk</title><desc id="d">The key stick holds the boot files, the LUKS header, a rescue system and an exchange area. The internal disk is one encrypted area with no partition table; it can only be opened with the header from the stick.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e9bad"/></marker></defs><text x="410" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="410" dy="0">Two devices: the key stick and the internal disk</tspan></text><rect x="40" y="70" width="300" height="330" rx="14" fill="none" stroke="#8e9bad" stroke-width="2"/><text x="190" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="190" dy="0">Key stick (USB)</tspan></text><rect x="56" y="114" width="268" height="44" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="190" y="126.85000000000001" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="190" dy="0">Boot files</tspan></text><text x="190" y="146.1" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="190" dy="0">signed; Secure Boot</tspan></text><rect x="56" y="166" width="268" height="44" rx="10" fill="#d42b63" stroke="#8e9bad" stroke-width="1.5"/><text x="190" y="178.85" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff" dominant-baseline="middle"><tspan x="190" dy="0">Disk header</tspan></text><text x="190" y="198.1" text-anchor="middle" font-size="11" font-weight="400" fill="rgba(255,255,255,.92)" dominant-baseline="middle"><tspan x="190" dy="0">the keyslots; 32 MB</tspan></text><rect x="56" y="218" width="268" height="60" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="190" y="238.85" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="190" dy="0">Rescue system</tspan></text><text x="190" y="258.1" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="190" dy="0">anonymous; nothing personal</tspan></text><rect x="56" y="286" width="268" height="96" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><text x="190" y="317.7" text-anchor="middle" font-size="13" font-weight="600" fill="#171c26" dominant-baseline="middle"><tspan x="190" dy="0">Exchange area</tspan></text><text x="190" y="336.95" text-anchor="middle" font-size="11" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="190" dy="0">plain exFAT for</tspan><tspan x="190" dy="14.3">other computers</tspan></text><rect x="460" y="70" width="320" height="330" rx="14" fill="none" stroke="#8e9bad" stroke-width="2"/><text x="620" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="620" dy="0">Internal disk (NVMe)</tspan></text><rect x="476" y="114" width="288" height="266" rx="10" fill="#057ba8" stroke="#8e9bad" stroke-width="1.5"/><text x="620" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" dominant-baseline="middle"><tspan x="620" dy="0">Encrypted (LUKS2), no partition table</tspan></text><rect x="484" y="154" width="48" height="170" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="508" y="239" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="508" dy="0">swap</tspan></text><rect x="540" y="154" width="48" height="170" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="564" y="215.6" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="564" dy="0">system</tspan><tspan x="564" dy="15.600000000000001">(reset at</tspan><tspan x="564" dy="15.600000000000001">every</tspan><tspan x="564" dy="15.600000000000001">boot)</tspan></text><rect x="596" y="154" width="48" height="170" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="620" y="239" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="620" dy="0">/home</tspan></text><rect x="652" y="154" width="48" height="170" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="676" y="239" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="676" dy="0">/nix</tspan></text><rect x="708" y="154" width="48" height="170" rx="8" fill="#ffffff" fill-opacity=".85" stroke="#8e9bad"/><text x="732" y="231.2" text-anchor="middle" font-size="12" font-weight="400" fill="#171c26" dominant-baseline="middle"><tspan x="732" dy="0">/persist</tspan><tspan x="732" dy="15.600000000000001">Flatpak</tspan></text><text x="620" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff" dominant-baseline="middle"><tspan x="620" dy="0">no header, no label: reads as random data</tspan></text><line x1="324" y1="188" x2="476" y2="174" stroke="#f5a9b8" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="170" text-anchor="middle" font-size="12" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="400" dy="0">needed to open</tspan></text></svg>
