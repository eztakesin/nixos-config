<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 538" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><title id="t">The protection layers, from the outside in</title><desc id="d">An attack passes the network, the applications, the system, the boot chain and the unlock before it reaches the data on the encrypted disk. Pinned software and the reset on every boot stand beside the whole stack.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e9bad"/></marker></defs><text x="410" y="22" text-anchor="middle" font-size="20" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="410" dy="0">The protection layers, from the outside in</tspan></text><rect x="170" y="64" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 79) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></g><text x="222" y="93" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">Network</tspan></text><text x="634" y="93" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">surveillance, censorship, scans</tspan></text><rect x="170" y="130" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 145) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><circle cx="6.3" cy="6.5" r=".9" fill="currentColor" stroke="none"/><circle cx="9.3" cy="6.5" r=".9" fill="currentColor" stroke="none"/></g><text x="222" y="159" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">Applications</tspan></text><text x="634" y="159" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">malicious pages, files, messages</tspan></text><rect x="170" y="196" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 211) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L20 5.5 V11.5 C20 16.5 16.5 20.3 12 21.5 C7.5 20.3 4 16.5 4 11.5 V5.5 Z"/><path d="M8.5 12.2 l2.4 2.4 4.6-5"/></g><text x="222" y="225" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">System hardening</tspan></text><text x="634" y="225" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">exploits, privilege escalation, rogue USB</tspan></text><rect x="170" y="262" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 277) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><rect x="10" y="10" width="4" height="4"/><path d="M9 3v4M12 3v4M15 3v4M9 17v4M12 17v4M15 17v4M3 9h4M3 12h4M3 15h4M17 9h4M17 12h4M17 15h4"/></g><text x="222" y="291" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">Boot integrity</tspan></text><text x="634" y="291" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">modified boot files</tspan></text><rect x="170" y="328" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 343) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="12" r="4"/><line x1="11.5" y1="12" x2="21" y2="12"/><line x1="17.5" y1="12" x2="17.5" y2="15.5"/><line x1="21" y1="12" x2="21" y2="15"/></g><text x="222" y="357" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">Unlocking</tspan></text><text x="634" y="357" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">watched or guessed passwords</tspan></text><rect x="170" y="394" width="480" height="58" rx="10" fill="#e9eef5" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 409) scale(1.1666666666666667)" fill="none" stroke="#171c26" color="#171c26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5 V7.5 a4 4 0 0 1 8 0 V10.5"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></g><text x="222" y="423" text-anchor="start" font-size="15" font-weight="700" fill="#171c26" dominant-baseline="middle"><tspan x="222" dy="0">Disk encryption</tspan></text><text x="634" y="423" text-anchor="end" font-size="13" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="634" dy="0">a lost or seized laptop</tspan></text><rect x="170" y="460" width="480" height="58" rx="10" fill="#057ba8" stroke="#8e9bad" stroke-width="1.5"/><g transform="translate(184 475) scale(1.1666666666666667)" fill="none" stroke="#ffffff" color="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 h8 l5 5 v13 H6 Z"/><path d="M14 3 v5 h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></g><text x="222" y="489" text-anchor="start" font-size="15" font-weight="700" fill="#ffffff" dominant-baseline="middle"><tspan x="222" dy="0">Your data</tspan></text><text x="634" y="489" text-anchor="end" font-size="13" font-weight="400" fill="#ffffff" dominant-baseline="middle"><tspan x="634" dy="0"></tspan></text><line x1="140" y1="58" x2="140" y2="512" stroke="#f5a9b8" stroke-width="2" marker-end="url(#arrow)"/><text x="140" y="48" text-anchor="middle" font-size="12" font-weight="400" fill="#5a667a" dominant-baseline="middle"><tspan x="140" dy="0">an attack comes from here</tspan></text><rect x="0" y="64" width="120" height="454" rx="10" fill="#d42b63" stroke="#8e9bad" stroke-width="1.5"/><text x="60" y="265.6" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" dominant-baseline="middle"><tspan x="60" dy="0">Supply chain</tspan></text><text x="60" y="286" text-anchor="middle" font-size="12" font-weight="400" fill="rgba(255,255,255,.92)" dominant-baseline="middle"><tspan x="60" dy="0">pinned,</tspan><tspan x="60" dy="15.600000000000001">signed</tspan><tspan x="60" dy="15.600000000000001">software</tspan></text><g transform="translate(40 104) scale(1.6666666666666667)" fill="none" stroke="#ffffff" color="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 L20.5 7.2 V16.8 L12 21.2 L3.5 16.8 V7.2 Z"/><path d="M3.5 7.2 L12 11.6 L20.5 7.2"/><line x1="12" y1="11.6" x2="12" y2="21.2"/></g><rect x="680" y="64" width="120" height="454" rx="10" fill="#d42b63" stroke="#8e9bad" stroke-width="1.5"/><text x="740" y="273.40000000000003" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" dominant-baseline="middle"><tspan x="740" dy="0">Fresh system</tspan></text><text x="740" y="293.8" text-anchor="middle" font-size="12" font-weight="400" fill="rgba(255,255,255,.92)" dominant-baseline="middle"><tspan x="740" dy="0">reset on</tspan><tspan x="740" dy="15.600000000000001">every boot</tspan></text><g transform="translate(720 104) scale(1.6666666666666667)" fill="none" stroke="#ffffff" color="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 a8 8 0 1 1 -2.3 -5.7"/><path d="M20.5 3.5 v5 h-5"/></g><g transform="translate(131 2) scale(0.75)" fill="none" stroke="#f5a9b8" color="#f5a9b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 L5 13.5 h6 l-1 8 L19 10.5 h-6 Z"/></g></svg>
